# outpost.pod is a helper template that is used to generate the pod spec for the
# Outpost instance. It is used by the Deployment template.
{{- define "outpost.pod" -}}
{{- if (.Values.serviceAccount).automountServiceAccountToken }}
serviceAccountName: {{ if not (.Values.serviceAccount).name }}{{ include "common.fullname" . }}{{ else }}{{ (.Values.serviceAccount).name }}{{ end }}
{{- end }}
{{- with .Values.podSecurityContext }}
securityContext: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.extraInitContainers }}
initContainers: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.nodeSelector }}
nodeSelector: {{- toYaml . | nindent 2 }}
{{- end }}
{{- with .Values.tolerations }}
tolerations: {{- toYaml . | nindent 2 }}
{{- end }}
{{- if or .Values.extraVolumeMounts .Values.extraConfigMaps .Values.extraSecretMounts }}
volumes:
  {{- range .Values.extraVolumeMounts }}
  - name: {{ .name }}
    {{- if .existingClaim }}
    persistentVolumeClaim:
      claimName: {{ .existingClaim }}
    {{- else if .hostPath }}
    hostPath:
      path: {{ .hostPath }}
    {{- else }}
    emptyDir: {}
    {{- end }}
  {{- end }}
  {{- range .Values.extraConfigMaps }}
  - name: {{ .name }}
    configMap:
      name: {{ .configMap }}
  {{- end }}
  {{- range .Values.extraSecretMounts }}
  {{- if .secretName }}
  - name: {{ .name }}
    secret:
      secretName: {{ .secretName }}
      defaultMode: {{ .defaultMode }}
  {{- else if .projected }}
  - name: {{ .name }}
    projected: {{- toYaml .projected | nindent 6 }}
  {{- else if .csi }}
  - name: {{ .name }}
    csi: {{- toYaml .csi | nindent 6 }}
  {{- end }}
  {{- end }}
{{- end }}
containers:
  - name: {{ .Chart.Name }}
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
    imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
    {{- with .Values.cribl.readinessProbe }}
    readinessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.cribl.livenessProbe }}
    livenessProbe:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .Values.securityContext }}
    securityContext:
      {{- toYaml .Values.securityContext | nindent 6 }}
    {{- end }}
    env:
      - name: CRIBL_DIST_LEADER_URL
        valueFrom:
          secretKeyRef:
            {{- if ((.Values.cribl).existingSecretForLeader) }}
            name: {{ .Values.cribl.existingSecretForLeader }}
            {{- else }}
            name: {{ include "common.fullname" . }}-cribl-settings
            {{- end }}
            key: CRIBL_DIST_LEADER_URL
      - name: CRIBL_HOME
        value: {{ .Values.cribl.home }}
      {{- if or .Values.cribl.config .Values.cribl.existingSecretForConfig }}
      - name: CRIBL_BOOTSTRAP
        valueFrom:
          secretKeyRef:
            {{- if ((.Values.cribl).existingSecretForConfig) }}
            name: {{ .Values.cribl.existingSecretForConfig }}
            {{- else }}
            name: {{ include "common.fullname" . }}-cribl-settings
            {{- end }}
            key: CRIBL_BOOTSTRAP
      {{- end }}
      {{- range $key, $value := .Values.extraEnv }}
      - name: {{ tpl $key $ }}
        value: "{{ tpl (print $value) $ }}"
      {{- end }}
      {{- if .Values.extraEnvFrom }}
      {{- toYaml .Values.extraEnvFrom | nindent 6 }}
      {{- end }}
      {{- if .Values.envValueFrom }}
      {{- toYaml .Values.envValueFrom | nindent 6 }}
      {{- end }}
      {{- range $key, $value := .Values.env }}
      - name: {{ tpl $key $ }}
        value: "{{ tpl (print $value) $ }}"
      {{- end }}
    {{- if or .Values.extraConfigMaps .Values.extraSecretMounts .Values.extraVolumeMounts }}
    volumeMounts:
      {{- range .Values.extraConfigMaps }}
      - name: {{ .name }}
        mountPath: {{ .mountPath }}
        subPath: {{ .subPath | default "" }}
        readOnly: {{ .readOnly }}
      {{- end }}
      {{- range .Values.extraSecretMounts }}
      - name: {{ .name }}
        mountPath: {{ .mountPath }}
        subPath: {{ .subPath | default "" }}
        readOnly: {{ .readOnly | default true }}
      {{- end }}
      {{- range .Values.extraVolumeMounts }}
      - name: {{ .name }}
        mountPath: {{ .mountPath }}
        subPath: {{ .subPath | default "" }}
        subPathExpr: {{ .subPathExpr | default "" }}
        readOnly: {{ .readOnly }}
      {{- end }}
    {{- end }}
    ports:
      {{-  range .Values.service.ports }}
      - name: {{ .name }}
        containerPort: {{ .port }}
      {{- end }}
    resources:
      {{- toYaml .Values.resources | nindent 6 }}
{{- if .Values.priorityClassName }}
priorityClassName: {{ .Values.priorityClassName }}
{{- end }}
{{- if .Values.terminationGracePeriodSeconds }}
terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
{{- end }}
{{- with .Values.extraContainers }}
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }} # outpost.pod