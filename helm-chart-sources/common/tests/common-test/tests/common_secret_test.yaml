# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: common.secret
templates:
  - secret.yaml
tests:
  - it: defaults as expected
    set:
      cribl:
        leader: http://cribl.example.com
        config: something
    asserts:
      - isAPIVersion:
          of: v1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common-test-cribl-settings
      - equal:
          path: stringData.CRIBL_DIST_LEADER_URL
          value: http://cribl.example.com
      - exists:
          path: stringData.CRIBL_BOOTSTRAP
  - it: doesn't create the secret if cribl.existingSecretForLeader is true and cribl.config is not set
    set:
      cribl:
        existingSecretForLeader: true
    asserts:
      - hasDocuments:
          count: 0
  - it: creates the secret if cribl.existingSecretForLeader is true and cribl.config is set
    set:
      cribl:
        existingSecretForLeader: true
        config: something
    asserts:
      - isAPIVersion:
          of: v1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-common-test-cribl-settings
      - notExists:
          path: stringData.CRIBL_DIST_LEADER_URL
      - exists:
          path: stringData.CRIBL_BOOTSTRAP