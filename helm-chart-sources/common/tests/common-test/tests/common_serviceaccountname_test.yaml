# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: common.serviceAccountName
templates:
  - helpers.yaml
tests:
  - it: uses the release name by default
    asserts:
      - equal:
          path: helpers["common.serviceAccountName"]
          value: default
  - it: uses the serviceAccount.name value if set with create
    release:
      name: foo
    set:
      serviceAccount:
        create: true
        name: bar
    asserts:
      - equal:
          path: helpers["common.serviceAccountName"]
          value: bar
  - it: uses the common.fullname value if create is true and name is not
    release:
      name: foo
    set:
      serviceAccount:
        create: true
    asserts:
      - equal:
          path: helpers["common.serviceAccountName"]
          value: foo-common-test